[project]
name = "wuo"
version = "0.4.1-rc6"
description = "Find Windows updates and install them through Windows and offline servicing"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
wuo = "wuo.cli:main"

[project.urls]
Repository = "https://github.com/joaofauvel/wuo"

[tool.hatch.build.targets.wheel]
packages = ["src/wuo"]

[tool.hatch.build.targets.wheel.force-include]
"hooks" = "wuo/bundled_hooks"

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/hooks", "/pyproject.toml", "/src/wuo"]

[dependency-groups]
dev = ["mypy>=1.19", "pytest>=9", "ruff>=0.15"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.15"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
